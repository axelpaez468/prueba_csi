# ---------- Límites contra floods (nivel http: este archivo se incluye dentro del bloque http) ----------
# Por IP: 20 peticiones/s sostenidas (con ráfaga) y 30 conexiones simultáneas.
limit_req_zone  $binary_remote_addr zone=por_ip:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=conexiones_ip:10m;

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    limit_req  zone=por_ip burst=60 nodelay;
    limit_conn conexiones_ip 30;
    limit_req_status  429;
    limit_conn_status 429;

    # Sitio estático: no acepta cuerpos y corta rápido a clientes lentos (slowloris).
    client_max_body_size   1k;
    client_body_timeout    10s;
    client_header_timeout  10s;
    keepalive_timeout      15s;
    send_timeout           15s;

    # Solo lectura: cualquier otro método se rechaza.
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }

    # Nota: un add_header dentro de un location anula los del nivel server,
    # por eso las cabeceras se repiten en cada location.

    # CanvasKit (motor de dibujo, varios MB) solo cambia con la versión de Flutter: caché larga.
    location /canvaskit/ {
        add_header Cache-Control "public, max-age=604800" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Todo lo demás se revalida en cada carga (no-cache + ETag): un despliegue nuevo se ve de inmediato.
    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        # CSP: solo se ejecuta código propio (CanvasKit requiere 'wasm-unsafe-eval'), y la app solo puede
        # conectarse a sí misma y a la API. Mitiga XSS: un script inyectado no podría enviar el token a otro sitio.
        # __API_URL__ se reemplaza al construir la imagen. fonts.gstatic.com: fuentes de respaldo de Flutter.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: __API_URL__; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' __API_URL__ https://fonts.gstatic.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;
        try_files $uri $uri/ /index.html;
    }
}
