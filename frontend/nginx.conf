server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # Nota: un add_header dentro de un location anula los del nivel server,
    # por eso las cabeceras se repiten en cada location.

    # CanvasKit (motor de dibujo, varios MB) solo cambia con la versión de Flutter: caché larga.
    location /canvaskit/ {
        add_header Cache-Control "public, max-age=604800" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Todo lo demás (index.html, main.dart.js, service worker, assets) se revalida en cada carga
    # (no-cache = usar la copia local solo si el servidor confirma que no cambió, vía ETag).
    # Así un nuevo despliegue se ve de inmediato, sin que el usuario tenga que limpiar la caché.
    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        try_files $uri $uri/ /index.html;
    }
}
