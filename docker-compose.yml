# Uso:  cp .env.example .env   (y cambiar los valores)
#       docker compose up --build
# Frontend: http://localhost:8080   API: http://localhost:5080   Correos y SMS de prueba: http://localhost:8025
name: pedidos

# Endurecimiento común: ningún proceso puede ganar privilegios (setuid) dentro del contenedor.
x-seguridad: &seguridad
  security_opt:
    - no-new-privileges:true

services:
  db:
    <<: *seguridad
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_MEMORY_LIMIT_MB: 2048
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Defina MSSQL_SA_PASSWORD en .env}
      DB_NAME: ${DB_NAME:-PedidosDb}
      APP_DB_USER: ${APP_DB_USER:-pedidos_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Defina APP_DB_PASSWORD en .env}
    # Arranca SQL Server y aplica db/init/init.sql (esquema + semilla + login de la app).
    entrypoint: ["/bin/bash", "/db/entrypoint.sh"]
    volumes:
      - mssql-data:/var/opt/mssql
      - ./db:/db:ro
    healthcheck:
      test: ["CMD", "/bin/bash", "/db/healthcheck.sh"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 40s
    mem_limit: 3g
    restart: unless-stopped
    # Sin puerto publicado: solo la API accede a la base de datos, por la red interna de compose.

  api:
    <<: *seguridad
    build: ./backend
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # La API usa el login de mínimos privilegios, no "sa".
      ConnectionStrings__Default: "Server=db,1433;Database=${DB_NAME:-PedidosDb};User Id=${APP_DB_USER:-pedidos_app};Password=${APP_DB_PASSWORD};Encrypt=True;TrustServerCertificate=True"
      Jwt__Key: ${JWT_KEY:?Defina JWT_KEY en .env (mínimo 32 caracteres)}
      # Cifra los secretos del 2FA y firma los códigos/enlaces (HMAC).
      Seguridad__ClaveMaestra: ${SEGURIDAD_CLAVE_MAESTRA:?Defina SEGURIDAD_CLAVE_MAESTRA en .env (32 bytes en Base64)}
      Cors__AllowedOrigins: ${FRONTEND_ORIGIN:-http://localhost:8080}
      # Enlaces de los correos (recuperación de contraseña).
      Frontend__UrlPublica: ${FRONTEND_ORIGIN:-http://localhost:8080}
      Correo__Host: mailpit
      Correo__Puerto: 1025
      Sms__Proveedor: Simulado
    ports:
      - "${API_PORT:-5080}:8080"
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    # Sistema de archivos de solo lectura y sin capacidades de Linux: si alguien lograra ejecutar código
    # en el contenedor, no podría modificar binarios ni escalar privilegios. Topes de recursos: un pico de
    # carga no puede dejar sin memoria/CPU al resto del host.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 200
    restart: unless-stopped

  # Bandeja de correo de pruebas (gratuita, de código abierto): atrapa los correos y los SMS simulados
  # y los muestra en http://localhost:8025. No envía nada a internet.
  mailpit:
    <<: *seguridad
    image: axllent/mailpit:v1.31
    environment:
      MP_MAX_MESSAGES: 500
    ports:
      - "8025:8025"
    cap_drop: [ALL]
    mem_limit: 128m
    restart: unless-stopped
    # El puerto SMTP (1025) no se publica: solo la API envía correos, por la red interna.

  frontend:
    <<: *seguridad
    build:
      context: ./frontend
      args:
        # URL de la API vista desde el navegador del usuario (no desde la red de Docker).
        API_URL: ${API_PUBLIC_URL:-http://localhost:5080}
    ports:
      - "8080:8080"
    depends_on:
      - api
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 100
    restart: unless-stopped

volumes:
  mssql-data:
